<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="qrcode.css">
</head>
<body>
    
    
    <div class="box">
        
        <div class="qr-header">
            <h1>QR Code Generator</h1>
           <input id="input-text" type="text" placeholder ="Enter Your URL">
           <div>
           <label for="size"><b>Select Quality:-</b>
           </label>
           <select id="size">         <option value ="100">100x100</option>
<option value ="200">200x200</option>
<option value ="300">300x300</option>
<option value ="400">400x400</option>
<option value ="500">500x500</option>
<option value ="600">600x600</option>
<option value ="700">700x700</option>
<option value ="800">800x800</option>
<option value ="900">900x900</option>
<option value ="1000">1000x1000</option>

</select>
          </div>  
        </div>
        <div class="qr-body">
            <div id="qrcode">
                
            </div>
            
        </div>
        <div class="qr-footer">
            <button id="gen">Genarate</button>
            <button id="download-btn">Download</button>
            
            
        </div>
        
    <p style="text-align: center; font-size: 13px; color:#ff0a00; font-weight: bold; margin-top:18px;">Created by Anubhab Dutta.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="qrcode.js"></script>
</body>
</html>
