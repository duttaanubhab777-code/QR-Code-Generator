<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Type, Generate, Download">
  <defs>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#ff2e93"/><stop offset="1" stop-color="#ffb020"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif}.t{font-size:22px;font-weight:700;fill:#fff}.s{font-size:14.5px;fill:#b9b0e6}</style>
  <path id="route" d="M170 90 H500 H830" stroke="url(#fl)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle r="9" fill="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M170 90 H830"/></circle>

  <g transform="translate(40 30)">
    <rect width="260" height="120" rx="22" fill="#12082e" stroke="#7c3aed" stroke-width="2"/>
    <text class="t" x="130" y="52" text-anchor="middle">1. Type</text>
    <text class="s" x="130" y="80" text-anchor="middle">Paste a URL or text</text>
    <rect x="62" y="92" width="136" height="14" rx="7" fill="#fff" fill-opacity=".1"/>
    <rect x="68" y="96" width="4" height="6" rx="2" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(370 30)">
    <rect width="260" height="120" rx="22" fill="#12082e" stroke="#ff2e93" stroke-width="2"/>
    <text class="t" x="130" y="52" text-anchor="middle">2. Generate</text>
    <text class="s" x="130" y="80" text-anchor="middle">Pick color and quality</text>
    <g transform="translate(95 90)">
      <circle cx="8" cy="8" r="7" fill="#7c3aed"><animate attributeName="cy" values="8;4;8" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="8" r="7" fill="#22d3ee"><animate attributeName="cy" values="8;4;8" dur="1.4s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="52" cy="8" r="7" fill="#10b981"><animate attributeName="cy" values="8;4;8" dur="1.4s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="74" cy="8" r="7" fill="#ff2e93"><animate attributeName="cy" values="8;4;8" dur="1.4s" begin=".6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <g transform="translate(700 30)">
    <rect width="260" height="120" rx="22" fill="#12082e" stroke="#ffb020" stroke-width="2"/>
    <text class="t" x="130" y="52" text-anchor="middle">3. Download</text>
    <text class="s" x="130" y="80" text-anchor="middle">PNG with the label</text>
    <path d="M130 90 V106 M122 99 L130 107 L138 99" stroke="#ffb020" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 -2;0 3;0 -2" dur="1.3s" repeatCount="indefinite"/></path>
  </g>
  <text class="s" x="500" y="190" text-anchor="middle">On supported phones a Share button appears next to Download.</text>
</svg>
